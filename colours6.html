            event.target.classList.add('active');

        // Data Cleaning Utilities
        function cleanHex(h) {
            if (!h || h === '[Blank]' || h === 'Blank') return null;
            let val = h.replace(/[^A-Fa-f0-9]/g, '');
            if (val.length === 3) val = val.split('').map(x => x+x).join('');
            return val.length === 6 ? `#${val.toUpperCase()}` : null;
        }

        function cmykToHex(cmykStr) {
            if (!cmykStr) return null;
            const c = parseInt((cmykStr.match(/C(\d+)/) || [0,0])[1]);
            const m = parseInt((cmykStr.match(/M(\d+)/) || [0,0])[1]);
            const y = parseInt((cmykStr.match(/Y(\d+)/) || [0,0])[1]);
            const k = parseInt((cmykStr.match(/K(\d+)/) || [0,0])[1]);

            const r = Math.round(255 * (1 - c/100) * (1 - k/100));
            const g = Math.round(255 * (1 - m/100) * (1 - k/100));
            const b = Math.round(255 * (1 - y/100) * (1 - k/100));
            
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }

        function getVal(hex) {
            if (!hex) return 0;
            const rgb = parseInt(hex.substring(1), 16);
            const r = (rgb >> 16) & 0xff, g = (rgb >>  8) & 0xff, b = (rgb >>  0) & 0xff;
            return Math.round((0.2126 * r + 0.7152 * g + 0.0722 * b) / 2.55);
        }

            const container = document.getElementById(containerId);

                groupDiv.className = isColumnBased ? 'flex flex-col gap-1' : 'flex flex-row gap-1';
                
                group.forEach(val => {
                    const box = document.createElement('div');
                    box.className = 'w-6 h-6 sm:w-8 sm:h-8 rounded-sm relative';
                    
                    const hexCode = isCMYK ? cmykToHex(val) : cleanHex(val);

                    if (hexCode) {
                        box.style.backgroundColor = hexCode;
                        box.classList.add('matrix-swatch');
                        box.title = hexCode + (isCMYK ? ` (${val})` : '');
                        box.onclick = () => openModal(hexCode);
                    } else {
                        box.style.backgroundColor = 'transparent';
                    }
                    groupDiv.appendChild(box);
                });
                container.appendChild(groupDiv);
            });
        }

            ["33FF00", "66FF33", "339900", "66CC00", "99FF33", "CCCC99", "FFFF99", "CC9966", "CC6600", "CC9999", "FF9999", "FF3399", "CC0066", "990066", "FF33CC", "FF00CC"],
            ["00CC00", "33CC00", "336600", "669933", "99CC66", "CCFF99", "FFFFCC", "FFCC99", "FF9933", "FFCCCC", "FF99CC", "CC6699", "993366", "660033", "CC0099", "330033"],

        const starCMYK = [

            ["C10 M90 Y10", "C10 M80 Y20", "C10 M70 Y30", "C10 M60 Y40", "C10 M50 Y50", "C10 M40 Y60", "C10 M30 Y70", "C10 M20 Y80", "C10 M10 Y90"],
            ["C20 M80 Y10", "C20 M70 Y20", "C20 M60 Y30", "C20 M50 Y40", "C20 M40 Y50", "C20 M30 Y60", "C20 M20 Y70", "C20 M10 Y80"],

            ["C100 M100", "C100 M90", "C90 M70", "C80 M40", "C70 M30 Y10", "C70 M20 Y20", "C70 M10 Y30", "C70 Y40", "C80 Y70", "C90 Y90", "C100 Y100"],
            ["C80 M30", "C80 M20 Y10", "C80 M10 Y20", "C80 Y30"],
            ["C80 M20", "C90 M10 Y10", "C90 Y20"],

        ];

        // MODAL & PALETTE LOGIC
        let activeModalHex = "";

        function openModal(hex) {
            activeModalHex = hex;
            document.getElementById('inspector-swatch').style.backgroundColor = hex;
            document.getElementById('inspector-hex').innerText = hex;
            document.getElementById('inspector-val').innerText = `Perceived Value: ${getVal(hex)}%`;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

        function addInspectorSwatch() {
            addToPalette(activeModalHex);
            copyToClipboard(activeModalHex);
        }

        const MAX_PALETTE = 16;
        let paletteColors = [];

        function initPalette() {
            const container = document.getElementById('palette-slots-container');
            container.innerHTML = '';
            for (let i = 0; i < MAX_PALETTE; i++) {
                let slot = document.createElement('div');
                slot.id = 'p-slot-' + i;
                slot.dataset.index = i;
                slot.className = 'palette-slot w-11 h-9 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50';
                
                slot.addEventListener('dragstart', handleDragStart);
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);
                slot.addEventListener('dragend', handleDragEnd);
                
                container.appendChild(slot);
            }
            updatePaletteUI();
        }

        function addToPalette(hex) {
            if (paletteColors.length < MAX_PALETTE) { paletteColors.push(hex); updatePaletteUI(); } 
            else { showToast("Palette Bank is Full (16/16)"); }
        }

        function removeFromPalette(index, event) {
            event.stopPropagation();
            paletteColors.splice(index, 1);
            updatePaletteUI();
        }

        function clearPalette() { paletteColors = []; updatePaletteUI(); showToast("Palette Cleared"); }

        function copyAllPaletteHex() {
            if (paletteColors.length === 0) return showToast("Palette is empty!");
            copyToClipboard(paletteColors.join(', '));
        }

        let draggedIndex = null;
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            if (isNaN(draggedIndex) || draggedIndex >= paletteColors.length) { e.preventDefault(); return; }
            e.dataTransfer.effectAllowed = 'move';
            this.classList.add('dragging');
        }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; this.classList.add('drag-over'); }
        function handleDragLeave() { this.classList.remove('drag-over'); }
        function handleDrop(e) {
            e.preventDefault(); this.classList.remove('drag-over');
            const targetIndex = parseInt(this.dataset.index);
            if (draggedIndex !== null && !isNaN(targetIndex) && targetIndex < paletteColors.length) {
                const movedColor = paletteColors.splice(draggedIndex, 1)[0];
                paletteColors.splice(targetIndex, 0, movedColor);
                updatePaletteUI();
            }
        }
        function handleDragEnd() {
            document.querySelectorAll('.palette-slot').forEach(slot => slot.classList.remove('dragging', 'drag-over'));
            draggedIndex = null;
        }

        function getContrast(hex) {
            const rgb = parseInt(hex.substring(1), 16);
            const r = (rgb >> 16) & 0xff, g = (rgb >>  8) & 0xff, b = (rgb >>  0) & 0xff;
            return (((r * 299) + (g * 587) + (b * 114)) / 1000 >= 128) ? '#0f172a' : '#ffffff';
        }

        function updatePaletteUI() {
            document.getElementById('palette-counter').innerText = `Global Comparison Palette (${paletteColors.length}/16)`;
            for (let i = 0; i < MAX_PALETTE; i++) {
                const slot = document.getElementById('p-slot-' + i);
                if (i < paletteColors.length) {
                    const hex = paletteColors[i];
                    slot.style.backgroundColor = hex;
                    slot.className = 'palette-slot w-11 h-9 rounded-xl border border-black/20 flex items-center justify-center cursor-grab transition-all shadow-sm hover:scale-105 relative group';
                    slot.setAttribute('draggable', 'true');
                    slot.innerHTML = `<span class="text-[8px] font-mono font-bold" style="color:${getContrast(hex)}">${hex.substring(1)}</span>
                        <button class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] font-bold hidden group-hover:flex items-center justify-center shadow cursor-pointer border border-white" onclick="removeFromPalette(${i}, event)">×</button>`;
                    slot.onclick = () => copyToClipboard(hex);
                } else {
                    slot.style.backgroundColor = 'transparent';
                    slot.className = 'palette-slot w-11 h-9 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 flex items-center justify-center';
                    slot.removeAttribute('draggable');
                    slot.innerHTML = '';
                    slot.onclick = null;
                }
            }
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(`Copied ${text}`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2200);
        }

        window.onload = () => {
            renderSwatchGrid('tab-hex', hexCols, true); // true = column based
            renderSwatchGrid('tab-arr2', arr2Rows, false); // false = row based
            renderSwatchGrid('tab-arr3', arr3Rows, false);
            renderSwatchGrid('tab-arr4', arr4Rows, false);
            renderSwatchGrid('tab-star', starCMYK, false, true); // isCMYK = true

            initPalette();
        };

        window.onclick = function(e) {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        };
    </script>
